name: image

on:
  push:
    branches: [main]
    paths: [Dockerfile, image/**, AGENTS.md, .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, image/**, AGENTS.md, .github/workflows/image.yml]
  schedule:
    # Monthly, for Ubuntu's security updates.
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: BUILT=${{ github.sha }}
          tags: decomp-worker:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Docker's default seccomp profile on this runner refuses 32-bit Wine's
      # socket call ("wine: socket : Function not implemented"); the same
      # check passes on a rented machine, so the profile is lifted here.
      - name: Check what is in it
        run: docker run --rm --security-opt seccomp=unconfined decomp-worker:candidate decomp-worker-check
      # The limit is CONTRIBUTING.md's. gzip -1 over the saved image came
      # within 1% of what the registry stored (1114 against 1122 MB).
      - name: Size
        run: |
          size=$(( $(docker save decomp-worker:candidate | gzip -1 | wc -c) / 1000000 ))
          echo "compressed: $size MB of 1000" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$size" -le 1000 ]
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: BUILT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
